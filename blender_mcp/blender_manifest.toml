schema_version = "1.0.0"

id = "blender_mcp"
version = "1.0.0"
name = "Blender MCP"
tagline = "Authenticated local-first MCP control for Blender"
maintainer = "GÖKSEL ÖZKAN <glonorce@github.com>"
type = "add-on"
website = "https://github.com/gmoddev/Blender_mcp"

blender_version_min = "5.0.0"
license = ["SPDX:MIT"]
platforms = ["windows-x64"]

wheels = [
  "./wheels/jaraco.classes-3.4.0-py3-none-any.whl",
  "./wheels/jaraco_context-6.1.2-py3-none-any.whl",
  "./wheels/jaraco_functools-4.6.0-py3-none-any.whl",
  "./wheels/keyring-25.7.0-py3-none-any.whl",
  "./wheels/more_itertools-11.1.0-py3-none-any.whl",
  "./wheels/pywin32_ctypes-0.2.3-py3-none-any.whl",
]

[permissions]
files = "Read and write user-authorized Blender project assets"
network = "Accept local MCP clients and access enabled asset providers"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.py[cod]",
]
